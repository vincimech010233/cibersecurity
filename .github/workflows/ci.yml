name: CI

on:
  push:
    branches: [main, portfolio-audit]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: |
          python -m unittest discover -s soc/logs -p 'test_*.py' -v
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check shell syntax
        run: find soc pentesting -name '*.sh' -type f -print0 | xargs -0 -r -n1 bash -n
